services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tambaya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tambaya"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tambaya
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "8000:8000"


volumes:
  pgdata:
